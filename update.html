<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Kortex startup</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      font-family: "inter", sans-serif;
      background: transparent;
      color: #F2EDE5;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .startup-shell {
      position: relative;
      width: 473px;
      height: 149px;
      border-radius: 11px;
      background: #151515;
      border: 1px solid #353534;
      box-shadow: inset 0 1px 0 rgba(255, 245, 235, 0.04), 0 24px 60px rgba(0, 0, 0, 0.55);
      -webkit-app-region: drag;
    }

    .logo {
      position: absolute;
      top: 34px;
      left: 50%;
      width: 30px;
      height: 30px;
      transform: translateX(-50%);
      background: url("./sources/Vector.png") center / contain no-repeat;
      filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.12));
      animation: breathe 2.4s ease-in-out infinite;
    }

    @keyframes breathe {
      0%, 100% { opacity: 0.75; transform: translateX(-50%) scale(0.97); }
      50% { opacity: 1; transform: translateX(-50%) scale(1); }
    }

    .status {
      position: absolute;
      top: 80px;
      left: 0;
      width: 100%;
      text-align: center;
      color: #AFAEA5;
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.01em;
      line-height: 15px;
      min-height: 15px;
    }

    .progress-shell {
      position: absolute;
      top: 123px;
      left: 18px;
      width: 437px;
      height: 5px;
      border-radius: 999px;
      overflow: hidden;
      background: #20201F;
      
      border: 0;
    }

    .progress-fill {
      position: relative;
      width: 5%;
      height: 100%;
      border-radius: 999px;
      background: #A8583A;
      box-shadow: 0 0 10px rgba(193, 112, 74, 0.5);
      transition: width 0.3s var(--ease, cubic-bezier(0.2, 0.8, 0.2, 1));
      overflow: hidden;
    }

    .progress-fill::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.171), transparent);
      animation: shimmer 1.6s linear infinite;
    }

    @keyframes shimmer {
      from { transform: translateX(-100%); }
      to { transform: translateX(100%); }
    }

    .footer {
      position: absolute;
      top: 101px;
      right: 18px;
      height: 12px;
    }

    .percent {
      color: #AFAEA5;
      font-size: 11px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
    }
  </style>
</head>
<body>
  <div class="startup-shell">
    <div class="logo"></div>
    <div class="status" id="loadingTexte">Searching for update...</div>

    <div class="progress-shell">
      <div class="progress-fill" id="update-progress-fill"></div>
    </div>

    <div class="footer">
      <span class="percent" id="loadingpourcentage">5%</span>
    </div>
  </div>

  <script>
    window.electronAPI.onStartupUpdateState((data) => {
      const state = data && data.state ? data.state : 'searching';
      const percent = Math.min(100, Math.max(0, Number(data && data.percent) || 5));
      const message = data && data.message ? data.message : 'Searching for update...';

      const loadingText = document.getElementById('loadingTexte');
      const loadingPercent = document.getElementById('loadingpourcentage');
      const progressFill = document.getElementById('update-progress-fill');

      if (loadingText) loadingText.textContent = message;
      if (loadingPercent) loadingPercent.textContent = `${Math.round(percent)}%`;
      if (progressFill) progressFill.style.width = `${percent}%`;
    });
  </script>
</body>
</html>
