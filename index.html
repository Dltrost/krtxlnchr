<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Kortex Launcher</title>
  <style>
    html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        /* OBLIGATOIRE : On dit à Chromium de ne rien dessiner en fond */
        background: transparent !important; 
        font-family: Arial, sans-serif;
        }

    .app-back {
        position: absolute;
        width: 100%;
        height: 100%;
        border-radius: 13px;
        /* -webkit-clip-path: inset(0 round 13px); */
        background-color: #1E1E21; 
        box-shadow: inset 0 0 0 1px #353538;
    
         /* Un léger contour pour donner l'effet "vitre" */
          /* border: 1px solid rgba(255, 255, 255, 0.1); */
    }

    /* Cette barre remplace la barre du haut et permet de glisser la fenêtre */
    .title-bar {
      -webkit-app-region: drag; /* Permet de déplacer la fenêtre */
      height: 35px;
      background-color: transparent;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 15px;
      color: white;
    }


    .content {
      padding: 20px;
    }

  </style>
</head>
<link rel="stylesheet" href="style.css">

    <div class="app-back"></div>

      <div class="raccourics"></div>
    </div>
    <button class="close-btn" onclick="window.close()"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-x-icon lucide-x"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>
