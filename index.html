<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Kortex Launcher</title>
  <style>
    html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        /* OBLIGATOIRE : On dit à Chromium de ne rien dessiner en fond */
        background: transparent !important; 
        font-family: Arial, sans-serif;
        }

    .app-back {
        position: absolute;
        width: 100%;
        height: 100%;
        border-radius: 13px;
        /* -webkit-clip-path: inset(0 round 13px); */
        background: linear-gradient(0deg, #0A1710, #223F33); 
        box-shadow: inset 0 0 0 1px #1D3029;
    
         /* Un léger contour pour donner l'effet "vitre" */
          /* border: 1px solid rgba(255, 255, 255, 0.1); */
    }

    /* Cette barre remplace la barre du haut et permet de glisser la fenêtre */
    .title-bar {
      -webkit-app-region: drag; /* Permet de déplacer la fenêtre */
      height: 55px;
      background-color: transparent;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 15px;
      color: white;
    }


    .content {
      padding: 20px;
    }

  </style>
</head>
<link rel="stylesheet" href="style.css">
